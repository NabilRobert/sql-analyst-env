  split: train
  source: agent-eval-harness
  prompt: How many customers made their very first rental in 2023 (UTC)?
  reference_sql: select count(*) from (select customer_id, min(rental_date at time zone 'UTC') as first_rental
    from rental group by customer_id) t where first_rental >= '2023-01-01' and first_rental < '2024-01-01'
  alternative_sql: select count(distinct r.customer_id) from rental r where r.rental_date >= timestamptz
    '2023-01-01 00:00:00+00' and r.rental_date < timestamptz '2024-01-01 00:00:00+00' and not exists (select
    1 from rental e where e.customer_id = r.customer_id and e.rental_date < timestamptz '2023-01-01 00:00:00+00')
  # Drops "very first": counts anyone who rented in 2023.
  wrong_sql: select count(distinct customer_id) from rental where rental_date >= timestamptz '2023-01-01
    00:00:00+00' and rental_date < timestamptz '2024-01-01 00:00:00+00'
- id: x08
  tags: [expert]
  family: windows
  split: train
  source: agent-eval-harness
  prompt: On average, how many days pass between a customer's consecutive rentals? Average over every
    pair of consecutive rentals by the same customer, rounded to 2 decimal places.
  reference_sql: select round(avg(extract(epoch from gap) / 86400)::numeric, 2) from (select rental_date
    - lag(rental_date) over (partition by customer_id order by rental_date) as gap from rental) t where
    gap is not null
  # The gaps of one customer add up to their last rental minus their first,
  # so the average over all pairs needs no window function.
  alternative_sql: select round((sum(extract(epoch from last_rental - first_rental)) / 86400 / sum(n -
    1))::numeric, 2) from (select customer_id, min(rental_date) as first_rental, max(rental_date) as last_rental,
    count(*) as n from rental group by customer_id having count(*) > 1) t
  # Averages each customer's average, so every customer weighs the same.
  wrong_sql: select round(avg(extract(epoch from last_rental - first_rental) / 86400 / (n - 1))::numeric,
    2) from (select customer_id, min(rental_date) as first_rental, max(rental_date) as last_rental, count(*)
    as n from rental group by customer_id having count(*) > 1) t
- id: x09
  tags: [expert]
  family: grouping
  split: train
  source: agent-eval-harness
  prompt: Among film categories with at least 50 films, which has the highest average rental rate? Give
    the category name and the average rounded to 2 decimal places.
  reference_sql: select c.name, round(avg(f.rental_rate), 2) from film f join film_category fc on fc.film_id
    = f.film_id join category c on c.category_id = fc.category_id group by c.name having count(*) >= 50
    order by avg(f.rental_rate) desc limit 1
  alternative_sql: select name, round(av, 2) from (select c.name, avg(f.rental_rate) as av, count(*) as
    n from category c join film_category fc using (category_id) join film f using (film_id) group by c.name)
    t where n >= 50 and av = (select max(av2) from (select avg(f.rental_rate) as av2 from film_category
    fc join film f using (film_id) group by fc.category_id having count(*) >= 50) m)
  # Averages over rentals, so popular films weigh more.
  wrong_sql: select c.name, round(avg(f.rental_rate), 2) from rental r join inventory i on i.inventory_id
    = r.inventory_id join film f on f.film_id = i.film_id join film_category fc on fc.film_id = f.film_id
    join category c on c.category_id = fc.category_id group by c.name having count(distinct f.film_id) >=
    50 order by avg(f.rental_rate) desc limit 1
- id: x10
