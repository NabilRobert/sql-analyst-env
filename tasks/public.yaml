  reference_sql: select m, inc from (select m, n - lag(n) over (order by m) as inc from (select to_char(rental_date
    at time zone 'UTC', 'YYYY-MM') as m, count(*) as n from rental group by m) t) u where inc is not null
    order by inc desc limit 1
  alternative_sql: with increases as (select to_char(mo, 'YYYY-MM') as m, n - lag(n) over (order by mo)
    as inc from (select date_trunc('month', rental_date at time zone 'UTC') as mo, count(*) as n from rental
    group by 1) t) select m, inc from increases where inc = (select max(inc) from increases)
  # Takes the largest change in either direction.
