[project]
name = "analyst-env"
version = "0.1.0"
description = "An RL training environment for a data-analyst agent, over Postgres through MCP-backbone"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # mcp 2.x is built on httpx2; its connection errors are httpx2's.
    "httpx2>=2.16,<3",
    # verifiers pins mcp==2.0.0 (ADR-002); matching it now avoids a clash in slice 2.
    "mcp==2.0.0",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0,<7",
    "sqlglot>=30.23,<31",
    "typer>=0.27,<1",
]

[project.scripts]
analyst-env = "analyst_env.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyst_env"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["analyst_env", "tests", "stack"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stack: needs the local stack running (docker compose up -d --wait)",
]
